<div class="organize-quarterly-goals-container">
  <!-- Top-left Back Arrow Button -->
  <button class="top-back-btn" (click)="onBack()" aria-label="Go back">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
      <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
    </svg>
  </button>

  <!-- Center Card -->
  <div class="card">
    <div class="icon-container">
      <div class="compass-circle">
        <svg class="compass-icon" viewBox="0 0 24 24" width="36" height="36" fill="#2dbdb1">
          <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
        </svg>
      </div>
    </div>

    <h1 class="title">One step at a time.</h1>

    <p class="description">
      Weekly planning will keep you on track to achieve your goals. Start with three goals for the week.
    </p>

    <div class="actions">
      <button type="button" class="btn btn-outlined" (click)="onBack()">Back</button>
      <button type="button" class="btn btn-filled" (click)="onNext()">Next</button>
    </div>
  </div>
</div>
