<div class="organize-quarterly-goals-container">
  <!-- Center Card -->
  <div class="card">
    <div class="icon-container">
      <img class="compass-logo" src="images/logo.svg" alt="Compass Logo" />
    </div>

    <h1 class="title">One step at a time.</h1>

    <p class="description">
      Weekly planning will keep you on track to achieve your goals. Start with three goals for the week.
    </p>

    <div class="actions">
      <button type="button" class="btn btn-outlined" (click)="onBack()">Back</button>
      <button type="button" class="btn btn-filled" (click)="onNext()">Next</button>
    </div>
  </div>
</div>
