<div class="quarterly-sidebar-item-container">
  <mat-checkbox
    #goalCheckbox
    [checked]="goal().completed"
    (change)="completedChange.emit($event.checked)"
  >
    <span
      class="goal-text"
      [class.completed-goal]="goalCheckbox.checked"
    >
      {{ goal().text }}
    </span>
  </mat-checkbox>
  <mat-divider></mat-divider>
</div>
